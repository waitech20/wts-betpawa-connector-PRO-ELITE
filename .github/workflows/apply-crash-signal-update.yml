name: Apply crash signal UI update
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch crash signal
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess, sys

          server = Path('server/index.js')
          frontend = Path('frontend/wts-login.js')
          s = server.read_text(encoding='utf-8')
          f = frontend.read_text(encoding='utf-8')

          if 'WTS_CRASH_SIGNAL_V1' in s and 'WTS_CRASH_SIGNAL_UI_V1' in f:
              print('Already patched; nothing to do.')
              sys.exit(0)

          old = """let liveRoundState = {\n  phase: 'UNKNOWN',      // UNKNOWN | FLYING | CRASHED\n  multiplier: null,\n  roundId: null,\n  newStateId: null,\n  timeLeft: null,\n  updatedAt: null\n};"""
          new = """let liveRoundState = {\n  phase: 'UNKNOWN',      // UNKNOWN | FLYING | CRASH_SIGNAL | CRASHED\n  multiplier: null,       // LAST LIVE TICK; never replaced by crashX during CRASH_SIGNAL\n  roundId: null,\n  newStateId: null,\n  timeLeft: null,\n  updatedAt: null\n};\n\n// WTS_CRASH_SIGNAL_V1: authoritative early crash-signal telemetry.\n// This is NOT a prediction; it records the crashX frame as soon as the\n// authenticated game socket delivers it, then waits for chart/state evidence.\nlet crashSignal = {\n  phase: 'WAITING', multiplier: null, crashX: null, roundId: null,\n  signalReceivedAt: null, lastTickAt: null, signalDelayMs: null,\n  chartConfirmedAt: null, flyAwayAt: null\n};"""
          if old not in s: raise SystemExit('server liveRoundState marker not found')
          s = s.replace(old, new, 1)

          old = """  if (tag === 'LIVE_TICK' && typeof fields.x === 'number') {\n    liveRoundState.phase = 'FLYING';\n    liveRoundState.multiplier = fields.x;\n    liveRoundState.updatedAt = now();\n    gameState.wsMultiplier = `${fields.x.toFixed(2)}x`;\n    gameState.wsConnected = true;\n    publishLiveTick('LIVE_TICK', { phase: 'FLYING', multiplier: fields.x, roundId: liveRoundState.roundId });\n    return;\n  }"""
          new = """  if (tag === 'LIVE_TICK' && typeof fields.x === 'number') {\n    const tickAt = now();\n    liveRoundState.phase = 'FLYING';\n    liveRoundState.multiplier = fields.x;\n    liveRoundState.updatedAt = tickAt;\n    gameState.wsMultiplier = `${fields.x.toFixed(2)}x`;\n    gameState.wsConnected = true;\n    crashSignal.phase = 'FLYING';\n    crashSignal.multiplier = fields.x;\n    crashSignal.lastTickAt = tickAt;\n    publishLiveTick('LIVE_TICK', { phase: 'FLYING', multiplier: fields.x, roundId: liveRoundState.roundId, lastTickAt: tickAt });\n    return;\n  }"""
          if old not in s: raise SystemExit('server LIVE_TICK marker not found')
          s = s.replace(old, new, 1)

          old = """  if (tag === 'CRASH' && typeof fields.crashX === 'number') {\n    if (fields.roundId != null && liveRoundState.roundId != null && fields.roundId !== liveRoundState.roundId) {\n      pushRoundHistory(fields.crashX);\n      return; // belongs to a different round — history only, not live state\n    }\n    if (!wasFlying) { pushRoundHistory(fields.crashX); return; }\n    liveRoundState.phase = 'CRASHED';\n    liveRoundState.multiplier = fields.crashX;\n    liveRoundState.updatedAt = now();\n    gameState.wsMultiplier = `${fields.crashX.toFixed(2)}x`;\n    pushRoundHistory(fields.crashX);\n    publishLiveTick('CRASH_LIVE', { phase: 'CRASHED', multiplier: fields.crashX, roundId: liveRoundState.roundId });\n    captureCrashScreenshot({ roundId: liveRoundState.roundId, multiplier: fields.crashX });\n    return;\n  }"""
          new = """  if (tag === 'CRASH' && typeof fields.crashX === 'number') {\n    if (fields.roundId != null && liveRoundState.roundId != null && fields.roundId !== liveRoundState.roundId) {\n      pushRoundHistory(fields.crashX);\n      return;\n    }\n    if (!wasFlying) { pushRoundHistory(fields.crashX); return; }\n\n    // CRASH X is the early authoritative socket signal. Keep LIVE MULTIPLIER\n    // at the last tick and publish immediately; chart/Fly Away remain separate.\n    const signalAt = now();\n    const delay = crashSignal.lastTickAt ? Math.max(0, Date.parse(signalAt) - Date.parse(crashSignal.lastTickAt)) : null;\n    crashSignal = { phase: 'CRASH_SIGNAL', multiplier: liveRoundState.multiplier, crashX: fields.crashX, roundId: liveRoundState.roundId, signalReceivedAt: signalAt, lastTickAt: crashSignal.lastTickAt, signalDelayMs: delay, chartConfirmedAt: null, flyAwayAt: null };\n    liveRoundState.phase = 'CRASH_SIGNAL';\n    liveRoundState.updatedAt = signalAt;\n    publishLiveTick('CRASH_SIGNAL_LIVE', { ...crashSignal });\n    pushRoundHistory(fields.crashX);\n    captureCrashScreenshot({ roundId: liveRoundState.roundId, multiplier: fields.crashX });\n    return;\n  }"""
          if old not in s: raise SystemExit('server CRASH marker not found')
          s = s.replace(old, new, 1)

          old = """  if (tag === 'ROUND_CHART_INFO' && typeof fields.maxMultiplier === 'number') {\n    if (!wasFlying || (fields.roundId != null && liveRoundState.roundId != null && fields.roundId !== liveRoundState.roundId)) {\n      pushRoundHistory(fields.maxMultiplier);\n      return; // historical chart burst for a past round — do not touch live state\n    }\n    liveRoundState.phase = 'CRASHED';\n    liveRoundState.multiplier = fields.maxMultiplier;\n    liveRoundState.updatedAt = now();\n    gameState.wsMultiplier = `${fields.maxMultiplier.toFixed(2)}x`;\n    pushRoundHistory(fields.maxMultiplier);\n    publishLiveTick('CRASH_LIVE', { phase: 'CRASHED', multiplier: fields.maxMultiplier, roundId: liveRoundState.roundId });\n    captureCrashScreenshot({ roundId: liveRoundState.roundId, multiplier: fields.maxMultiplier });\n    return;\n  }"""
          new = """  if (tag === 'ROUND_CHART_INFO' && typeof fields.maxMultiplier === 'number') {\n    if (!wasFlying || (fields.roundId != null && liveRoundState.roundId != null && fields.roundId !== liveRoundState.roundId)) {\n      pushRoundHistory(fields.maxMultiplier);\n      return;\n    }\n    const confirmedAt = now();\n    if (crashSignal.crashX != null && Math.abs(Number(crashSignal.crashX) - Number(fields.maxMultiplier)) < 1e-9) {\n      crashSignal.chartConfirmedAt = confirmedAt;\n      publishLiveTick('CHART_CONFIRM_LIVE', { ...crashSignal });\n      return;\n    }\n    liveRoundState.phase = 'CRASHED';\n    liveRoundState.multiplier = fields.maxMultiplier;\n    liveRoundState.updatedAt = confirmedAt;\n    gameState.wsMultiplier = `${fields.maxMultiplier.toFixed(2)}x`;\n    pushRoundHistory(fields.maxMultiplier);\n    publishLiveTick('CRASH_LIVE', { phase: 'CRASHED', multiplier: fields.maxMultiplier, roundId: liveRoundState.roundId });\n    captureCrashScreenshot({ roundId: liveRoundState.roundId, multiplier: fields.maxMultiplier });\n    return;\n  }"""
          if old not in s: raise SystemExit('server chart marker not found')
          s = s.replace(old, new, 1)

          old = """  if (tag === 'STATE_CHANGE') {\n    if (fields.roundId != null) liveRoundState.roundId = fields.roundId;\n    if (fields.timeLeft != null) liveRoundState.timeLeft = fields.timeLeft;\n    if (fields.newStateId != null) { liveRoundState.newStateId = fields.newStateId; }\n    liveRoundState.updatedAt = now();\n    publishLiveTick('STATE_LIVE', { newStateId: fields.newStateId, roundId: liveRoundState.roundId, timeLeft: fields.timeLeft });\n  }"""
          new = """  if (tag === 'STATE_CHANGE') {\n    if (fields.roundId != null) liveRoundState.roundId = fields.roundId;\n    if (fields.timeLeft != null) liveRoundState.timeLeft = fields.timeLeft;\n    if (fields.newStateId != null) { liveRoundState.newStateId = fields.newStateId; }\n    const stateAt = now();\n    liveRoundState.updatedAt = stateAt;\n    if (fields.newStateId === 1 && crashSignal.crashX != null) {\n      crashSignal.phase = 'FLY_AWAY';\n      crashSignal.flyAwayAt = stateAt;\n      publishLiveTick('FLY_AWAY_LIVE', { ...crashSignal });\n    } else if (fields.newStateId === 2) {\n      liveRoundState.phase = 'UNKNOWN';\n      crashSignal.phase = 'FLYING';\n    }\n    publishLiveTick('STATE_LIVE', { newStateId: fields.newStateId, roundId: liveRoundState.roundId, timeLeft: fields.timeLeft, crashSignal: { ...crashSignal } });\n  }"""
          if old not in s: raise SystemExit('server state marker not found')
          s = s.replace(old, new, 1)

          old = """app.get('/api/ws-sniff', (req, res) => {\n  res.json({\n    ok: true,\n    active: wsSniffActive,\n    mode: monitorMode,\n    liveRoundState,\n    nextCrash,"""
          if old in s:
              s = s.replace(old, """app.get('/api/ws-sniff', (req, res) => {\n  res.json({\n    ok: true,\n    active: wsSniffActive,\n    mode: monitorMode,\n    liveRoundState,\n    crashSignal,\n    nextCrash,""", 1)

          marker = """liveRoundState,\n      nextCrash,"""
          if marker in s:
              s = s.replace(marker, """liveRoundState,\n      crashSignal,\n      nextCrash,""", 1)
          server.write_text(s, encoding='utf-8')

          marker = """  injectStyles();\n  injectInfoButton();"""
          ui = r'''

  // WTS_CRASH_SIGNAL_UI_V1
  (() => {
    const state={liveMultiplier:null,roundId:null,phase:'WAITING',crashX:null,signalReceivedAt:null,lastTickAt:null,signalDelayMs:null,chartConfirmedAt:null,flyAwayAt:null};
    let es=null;
    const css=document.createElement('style');
    css.textContent=`.wts-crash-signal-card{margin:14px 0 0;padding:16px;border:1px solid rgba(156,232,0,.18);border-radius:16px;background:linear-gradient(145deg,rgba(12,17,19,.98),rgba(20,26,28,.96));box-shadow:0 12px 35px rgba(0,0,0,.28)}.wts-crash-signal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.wts-crash-signal-head strong{font-size:12px;letter-spacing:.12em;color:#dfe8e8}.wts-crash-signal-badge{font-size:10px;font-weight:800;letter-spacing:.08em;padding:5px 8px;border-radius:999px;background:rgba(255,170,0,.1);color:#ffd27a;border:1px solid rgba(255,170,0,.22)}.wts-crash-signal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.wts-crash-signal-row{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.035)}.wts-crash-signal-row span{font-size:10px;color:#7f898d}.wts-crash-signal-row b{font-size:11px;color:#edf2f2;text-align:right}.wts-crash-signal-row.crash b{color:#ffcf66}.wts-crash-signal-row.delay b{color:#9ce800}.wts-crash-signal-foot{margin-top:10px;font-size:9px;color:#657074}.wts-crash-signal-card.signal{border-color:rgba(255,190,70,.38);box-shadow:0 0 0 1px rgba(255,190,70,.06),0 14px 40px rgba(0,0,0,.32)}@media(max-width:640px){.wts-crash-signal-grid{grid-template-columns:1fr}}`;
    document.head.appendChild(css);
    const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmtX=v=>v==null?'—':`${Number(v).toFixed(2)}x`;
    const fmtTime=v=>{if(!v)return 'WAITING...';try{return new Date(v).toLocaleTimeString([], {hour12:false})}catch{return String(v)}};
    const fmtDelay=v=>v==null?'—':`${Math.max(0,Math.round(Number(v)))}ms`;
    function ensure(){if(!phase2Page||!gameSection||String(selectedGame)!=='aviator')return null;let p=document.getElementById('wts-crash-signal-card'),a=document.getElementById('wts-flight');if(!p&&a){p=document.createElement('section');p.id='wts-crash-signal-card';p.className='wts-crash-signal-card';a.insertAdjacentElement('afterend',p)}return p}
    function render(){const p=ensure();if(!p)return;const status=state.phase==='CRASH_SIGNAL'?'⚡ CRASH SIGNAL':state.phase==='FLY_AWAY'?'✈ FLY AWAY':state.phase==='FLYING'?'FLYING':'WAITING';p.classList.toggle('signal',state.phase==='CRASH_SIGNAL');p.innerHTML=`<div class="wts-crash-signal-head"><strong>CRASH TELEMETRY • LIVE WS</strong><span class="wts-crash-signal-badge">${esc(status)}</span></div><div class="wts-crash-signal-grid"><div class="wts-crash-signal-row"><span>LIVE MULTIPLIER</span><b>${fmtX(state.liveMultiplier)}</b></div><div class="wts-crash-signal-row"><span>ROUND</span><b>${esc(state.roundId)}</b></div><div class="wts-crash-signal-row"><span>STATUS</span><b>${esc(status)}</b></div><div class="wts-crash-signal-row crash"><span>CRASH X</span><b>${fmtX(state.crashX)}</b></div><div class="wts-crash-signal-row"><span>SIGNAL RECEIVED</span><b>${fmtTime(state.signalReceivedAt)}</b></div><div class="wts-crash-signal-row"><span>LAST TICK</span><b>${fmtTime(state.lastTickAt)}</b></div><div class="wts-crash-signal-row delay"><span>SIGNAL DELAY</span><b>${fmtDelay(state.signalDelayMs)}</b></div><div class="wts-crash-signal-row"><span>CHART CONFIRM</span><b>${fmtTime(state.chartConfirmedAt)}</b></div><div class="wts-crash-signal-row"><span>FLY AWAY</span><b>${fmtTime(state.flyAwayAt)}</b></div></div><div class="wts-crash-signal-foot">CRASH X is shown at WebSocket receipt time; chart confirmation and FLY AWAY are displayed separately.</div>`}
    function apply(d){if(!d)return;Object.assign(state,{phase:d.phase??state.phase,liveMultiplier:d.multiplier??state.liveMultiplier,roundId:d.roundId??state.roundId,crashX:d.crashX??state.crashX,signalReceivedAt:d.signalReceivedAt??state.signalReceivedAt,lastTickAt:d.lastTickAt??state.lastTickAt,signalDelayMs:d.signalDelayMs??state.signalDelayMs,chartConfirmedAt:d.chartConfirmedAt??state.chartConfirmedAt,flyAwayAt:d.flyAwayAt??state.flyAwayAt});render()}
    async function boot(){try{const r=await fetch(API.status,{cache:'no-store'}),d=await r.json();apply(d.crashSignal);const l=d.liveRoundState||{};if(l.multiplier!=null)state.liveMultiplier=l.multiplier;if(l.roundId!=null)state.roundId=l.roundId;render()}catch{}}
    function connect(){if(es||!window.EventSource)return;try{es=new EventSource(API.events);es.onmessage=e=>{try{const ev=JSON.parse(e.data),d=ev.data||{};if(ev.type==='LIVE_TICK'){state.liveMultiplier=d.multiplier??state.liveMultiplier;state.roundId=d.roundId??state.roundId;state.lastTickAt=d.lastTickAt??state.lastTickAt;if(state.phase!=='CRASH_SIGNAL'&&state.phase!=='FLY_AWAY')state.phase='FLYING';render()}else if(ev.type==='CRASH_SIGNAL_LIVE'||ev.type==='CHART_CONFIRM_LIVE'||ev.type==='FLY_AWAY_LIVE')apply(d);else if(ev.type==='STATE_LIVE'){if(d.roundId!=null)state.roundId=d.roundId;if(d.newStateId===2)state.phase='FLYING';if(d.crashSignal)apply(d.crashSignal);render()}}catch{}};es.onerror=()=>{try{es.close()}catch{}es=null;setTimeout(connect,1800)}}catch{es=null}}
    setInterval(()=>{if(phase2Page){ensure();render()}},500);boot();connect();
  })();
'''
          if marker not in f: raise SystemExit('frontend inject marker not found')
          f = f.replace(marker, marker + ui, 1)
          frontend.write_text(f, encoding='utf-8')

          subprocess.run(['node','--check','server/index.js'], check=True)
          subprocess.run(['node','--check','frontend/wts-login.js'], check=True)
          print('Syntax checks passed.')
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/index.js frontend/wts-login.js
          git commit -m "feat: add instant crash signal telemetry UI"
          git push
