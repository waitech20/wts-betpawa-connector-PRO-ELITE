name: Fix crash signal confirmation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix: crash signal confirmation') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure chart confirmation works after CRASH SIGNAL
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('server/index.js')
          s=p.read_text(encoding='utf-8')
          old="""  if (tag === 'ROUND_CHART_INFO' && typeof fields.maxMultiplier === 'number') {
    if (!wasFlying || (fields.roundId != null && liveRoundState.roundId != null && fields.roundId !== liveRoundState.roundId)) {
      pushRoundHistory(fields.maxMultiplier);
      return;
    }
    const confirmedAt = now();"""
          new="""  if (tag === 'ROUND_CHART_INFO' && typeof fields.maxMultiplier === 'number') {
    const chartBelongsToLiveSignal = crashSignal.phase === 'CRASH_SIGNAL' &&
      crashSignal.crashX != null &&
      (fields.roundId == null || liveRoundState.roundId == null || fields.roundId === liveRoundState.roundId) &&
      Math.abs(Number(crashSignal.crashX) - Number(fields.maxMultiplier)) < 1e-9;
    if (!wasFlying && !chartBelongsToLiveSignal || (fields.roundId != null && liveRoundState.roundId != null && fields.roundId !== liveRoundState.roundId)) {
      pushRoundHistory(fields.maxMultiplier);
      return;
    }
    const confirmedAt = now();"""
          if old in s:
            s=s.replace(old,new,1)
            p.write_text(s,encoding='utf-8')
          else:
            print('confirmation block already updated or not present')
          PY
          node --check server/index.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/index.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: crash signal confirmation'
          git push
