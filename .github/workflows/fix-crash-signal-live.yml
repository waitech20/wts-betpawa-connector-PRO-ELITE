name: Apply crash X live updates
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply live telemetry, UI and bet-control fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          server = Path('server/index.js')
          login = Path('frontend/wts-login.js')
          elite = Path('frontend/wts-elite-flight.js')
          index = Path('frontend/index.html')
          s = server.read_text()
          f = login.read_text()
          e = elite.read_text()
          h = index.read_text()

          if 'WTS_CRASH_SIGNAL_LIVE_V2' not in s:
              marker = 'let gameState = {'
              state = """// WTS_CRASH_SIGNAL_LIVE_V2
let crashSignal = { phase: 'WAITING', crashX: null, roundId: null, signalReceivedAt: null };

"""
              if marker not in s: raise SystemExit('server marker not found')
              s = s.replace(marker, state + marker, 1)

          start = s.find("  if (tag === 'CRASH' && typeof fields.crashX === 'number') {")
          end = s.find("  if (tag === 'ROUND_CHART_INFO' && typeof fields.maxMultiplier === 'number') {", start)
          if start < 0 or end < 0: raise SystemExit('crash branch markers not found')
          branch = """  if (tag === 'CRASH' && typeof fields.crashX === 'number') {
    const wasFlying = liveRoundState.phase === 'FLYING';
    if (fields.roundId != null && liveRoundState.roundId != null && fields.roundId !== liveRoundState.roundId) {
      pushRoundHistory(fields.crashX);
      return;
    }
    if (!wasFlying) { pushRoundHistory(fields.crashX); return; }
    const signalAt = now();
    crashSignal = { phase: 'CRASH_SIGNAL', crashX: fields.crashX, roundId: liveRoundState.roundId, signalReceivedAt: signalAt };
    liveRoundState.phase = 'FLYING';
    liveRoundState.updatedAt = signalAt;
    publishLiveTick('CRASH_SIGNAL_LIVE', { phase: 'FLYING', multiplier: liveRoundState.multiplier, crashX: fields.crashX, roundId: liveRoundState.roundId, signalReceivedAt: signalAt });
    pushRoundHistory(fields.crashX);
    captureCrashScreenshot({ roundId: liveRoundState.roundId, multiplier: fields.crashX });
    return;
  }

"""
          s = s[:start] + branch + s[end:]

          if '    crashSignal,' not in s:
              s = s.replace('    liveRoundState,\n', '    liveRoundState,\n    crashSignal,\n', 1)
          reset = "  liveRoundState = { phase: 'UNKNOWN', multiplier: null, roundId: null, newStateId: null, timeLeft: null, updatedAt: null };\n"
          if reset in s and "crashSignal = { phase: 'WAITING'" not in s:
              s = s.replace(reset, reset + "  crashSignal = { phase: 'WAITING', crashX: null, roundId: null, signalReceivedAt: null };\n", 1)

          if 'WTS_CRASH_SIGNAL_UI_LIVE_V2' not in f:
              needle = "    if (event.type === 'LIVE_TICK' || event.type === 'CRASH_LIVE' || event.type === 'STATE_LIVE') {"
              inject = """    // WTS_CRASH_SIGNAL_UI_LIVE_V2
    if (event.type === 'CRASH_SIGNAL_LIVE') {
      const d = event.data || {};
      if (typeof window.__wtsEliteCrashSignal === 'function') window.__wtsEliteCrashSignal(d);
      updateFlightAnimation({ phase: 'FLYING', multiplier: d.multiplier, roundId: d.roundId, crashX: d.crashX });
    }

"""
              if needle not in f: raise SystemExit('frontend event marker not found')
              f = f.replace(needle, inject + needle, 1)

          f = f.replace('btn.disabled = !b.ready;', "btn.disabled = false; btn.classList.toggle('is-not-ready', !b.ready);")

          if 'WTS_CRASH_SIGNAL_OVERLAY_V3' not in e:
              e = e.rstrip() + """

// WTS_CRASH_SIGNAL_OVERLAY_V3
(() => {
  'use strict';
  const ID='wts-crash-signal-live-overlay', STYLE='wts-crash-signal-live-style';
  function ensure(){
    if(document.getElementById(STYLE)===null){const s=document.createElement('style');s.id=STYLE;s.textContent=`#${ID}{position:fixed;right:18px;top:88px;z-index:2147483000;display:flex;align-items:center;gap:9px;padding:10px 14px;border:1px solid rgba(255,23,79,.45);border-radius:12px;background:rgba(7,10,20,.95);box-shadow:0 0 24px rgba(255,23,79,.2);font:800 12px/1 Arial,sans-serif;letter-spacing:.05em;color:#fff;backdrop-filter:blur(9px)}#${ID} .wts-cs-label{color:#aab3c5}#${ID} .wts-cs-value{font-size:17px;color:#ff174f;min-width:52px;text-align:right}#${ID} .wts-cs-state{font-size:9px;color:#00e676}#${ID}.waiting .wts-cs-value{color:#7e8799}.wts-cs-spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.18);border-top-color:#ff174f;border-radius:50%;animation:wtsCsSpin .65s linear infinite}@keyframes wtsCsSpin{to{transform:rotate(360deg)}}`;document.head.appendChild(s)}
    let el=document.getElementById(ID);if(el)return el;
    el=document.createElement('div');el.id=ID;el.className='waiting';el.innerHTML='<span class="wts-cs-label">CRASH X</span><strong class="wts-cs-value"><span class="wts-cs-spin"></span></strong><span class="wts-cs-state">WAITING WS</span>';document.body.appendChild(el);return el;
  }
  window.__wtsEliteCrashSignal=d=>{if(!d||typeof d.crashX!=='number')return;const el=ensure();el.classList.remove('waiting');el.querySelector('.wts-cs-value').textContent=Number(d.crashX).toFixed(2)+'x';el.querySelector('.wts-cs-state').textContent='FLYING • WS'};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',ensure,{once:true});else ensure();
})();
"""

          if 'wts-elite-flight.js' not in h:
              p = h.lower().rfind('</body>')
              if p < 0: raise SystemExit('index body marker not found')
              h = h[:p] + '  <script src="wts-elite-flight.js"></script>\n' + h[p:]

          server.write_text(s); login.write_text(f); elite.write_text(e); index.write_text(h)
          old = Path('.github/workflows/apply-crash-signal-update.yml')
          if old.exists(): old.unlink()
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','server/index.js','frontend/wts-login.js','frontend/wts-elite-flight.js','frontend/index.html','.github/workflows/apply-crash-signal-update.yml'], check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode == 0: raise SystemExit(0)
          subprocess.run(['git','commit','-m','fix: immediate crashX telemetry and bet controls'], check=True)
          subprocess.run(['git','push'], check=True)
          PY