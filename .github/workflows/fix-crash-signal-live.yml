name: Fix crash X live telemetry
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply immediate crashX telemetry patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, subprocess, sys

          server = Path('server/index.js')
          frontend = Path('frontend/wts-login.js')
          index = Path('frontend/index.html')
          s = server.read_text(encoding='utf-8')
          f = frontend.read_text(encoding='utf-8')
          h = index.read_text(encoding='utf-8')

          # Backend: add authoritative signal state once.
          if 'WTS_CRASH_SIGNAL_LIVE_V2' not in s:
              marker = "let gameState = {"
              state = """// WTS_CRASH_SIGNAL_LIVE_V2\n// Authoritative telemetry only: populated immediately when the authenticated\n// game WebSocket delivers a crashX field. This is not a prediction.\nlet crashSignal = {\n  phase: 'WAITING',\n  crashX: null,\n  roundId: null,\n  signalReceivedAt: null\n};\n\n"""
              if marker not in s:
                  raise SystemExit('gameState marker not found')
              s = s.replace(marker, state + marker, 1)

          # Backend: replace only the CRASH branch inside applyLiveRoundUpdate.
          start = s.find("  if (tag === 'CRASH' && typeof fields.crashX === 'number') {")
          end = s.find("  if (tag === 'ROUND_CHART_INFO' && typeof fields.maxMultiplier === 'number') {", start)
          if start < 0 or end < 0:
              raise SystemExit('CRASH/ROUND_CHART_INFO boundaries not found')
          old_branch = s[start:end]
          new_branch = r'''  if (tag === 'CRASH' && typeof fields.crashX === 'number') {
    const wasFlying = liveRoundState.phase === 'FLYING';
    if (fields.roundId != null && liveRoundState.roundId != null && fields.roundId !== liveRoundState.roundId) {
      pushRoundHistory(fields.crashX);
      return; // different round: history only
    }
    if (!wasFlying) {
      pushRoundHistory(fields.crashX);
      return;
    }

    // IMPORTANT: do not wait for chart confirmation, screenshot, or CRASHED.
    // The moment the WebSocket frame is classified, publish crashX separately
    // while the flight remains visually FLYING.
    const signalAt = now();
    crashSignal = {
      phase: 'CRASH_SIGNAL',
      crashX: fields.crashX,
      roundId: liveRoundState.roundId,
      signalReceivedAt: signalAt
    };
    liveRoundState.phase = 'FLYING';
    liveRoundState.updatedAt = signalAt;
    publishLiveTick('CRASH_SIGNAL_LIVE', {
      phase: 'FLYING',
      multiplier: liveRoundState.multiplier,
      crashX: fields.crashX,
      roundId: liveRoundState.roundId,
      signalReceivedAt: signalAt
    });
    pushRoundHistory(fields.crashX);
    captureCrashScreenshot({ roundId: liveRoundState.roundId, multiplier: fields.crashX });
    return;
  }

'''
          s = s[:start] + new_branch + s[end:]

          # Frontend: add a dedicated immediate SSE branch before the generic
          # LIVE_TICK/CRASH_LIVE handling, so crashX cannot be lost in the
          # normal flight update path.
          if 'WTS_CRASH_SIGNAL_UI_LIVE_V2' not in f:
              needle = "    if (event.type === 'LIVE_TICK' || event.type === 'CRASH_LIVE' || event.type === 'STATE_LIVE') {"
              inject = r'''    // WTS_CRASH_SIGNAL_UI_LIVE_V2: crashX is rendered immediately from SSE.
    // Keep the aircraft in FLYING and keep the live multiplier unchanged.
    if (event.type === 'CRASH_SIGNAL_LIVE') {
      const d = event.data || {};
      if (typeof window.__wtsEliteCrashSignal === 'function') {
        window.__wtsEliteCrashSignal(d);
      }
      updateFlightAnimation({
        phase: 'FLYING',
        multiplier: d.multiplier,
        roundId: d.roundId,
        crashX: d.crashX
      });
    }

'''
              if needle not in f:
                  raise SystemExit('frontend event handler marker not found')
              f = f.replace(needle, inject + needle, 1)

          # Add a self-contained visible CRASH X telemetry overlay. It does
          # not depend on existing card IDs, so layout changes cannot hide it.
          elite = Path('frontend/wts-elite-flight.js')
          e = elite.read_text(encoding='utf-8') if elite.exists() else ''
          if 'WTS_CRASH_SIGNAL_OVERLAY_V2' not in e:
              overlay = r'''

// WTS_CRASH_SIGNAL_OVERLAY_V2
(() => {
  'use strict';
  const ID = 'wts-crash-signal-live-overlay';
  const ensure = () => {
    let el = document.getElementById(ID);
    if (el) return el;
    el = document.createElement('div');
    el.id = ID;
    el.innerHTML = '<span class="wts-cs-label">CRASH X</span><strong class="wts-cs-value">—</strong><span class="wts-cs-state">WAITING</span>';
    el.style.cssText = 'position:fixed;right:18px;top:88px;z-index:2147483000;display:none;align-items:center;gap:10px;padding:10px 14px;border:1px solid rgba(255,23,79,.55);border-radius:12px;background:rgba(7,10,20,.94);box-shadow:0 0 24px rgba(255,23,79,.22);font:700 13px/1.1 Arial,sans-serif;letter-spacing:.04em;color:#fff;backdrop-filter:blur(8px)';
    document.body.appendChild(el);
    return el;
  };
  window.__wtsEliteCrashSignal = (d) => {
    if (!d || typeof d.crashX !== 'number') return;
    const el = ensure();
    const v = el.querySelector('.wts-cs-value');
    const st = el.querySelector('.wts-cs-state');
    v.textContent = Number(d.crashX).toFixed(2) + 'x';
    st.textContent = 'FLYING • WS';
    el.style.display = 'flex';
  };
})();
'''
              e = e.rstrip() + overlay
              elite.write_text(e, encoding='utf-8')

          # Ensure the elite script is present in the page (idempotent).
          tag = '<script src="wts-elite-flight.js"></script>'
          if 'wts-elite-flight.js' not in h:
              pos = h.lower().rfind('</body>')
              if pos < 0:
                  raise SystemExit('index closing body marker not found')
              h = h[:pos] + '  ' + tag + '\n' + h[pos:]

          server.write_text(s, encoding='utf-8')
          frontend.write_text(f, encoding='utf-8')
          index.write_text(h, encoding='utf-8')

          # Remove the old one-shot workflow after successful application.
          oldwf = Path('.github/workflows/apply-crash-signal-update.yml')
          if oldwf.exists():
              oldwf.unlink()

          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','server/index.js','frontend/wts-login.js','frontend/wts-elite-flight.js','frontend/index.html','.github/workflows/apply-crash-signal-update.yml'], check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode == 0:
              print('No changes needed')
              sys.exit(0)
          subprocess.run(['git','commit','-m','fix: render crashX immediately from websocket'], check=True)
          subprocess.run(['git','push'], check=True)
          PY
