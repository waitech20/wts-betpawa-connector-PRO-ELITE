name: Repair and Elite Flight View

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore safe baseline index and apply elite flight UI
        shell: bash
        run: |
          set -euo pipefail
          BASE=42397d90281b4c32e534a01714104e10230aaf2e
          git checkout "$BASE" -- frontend/index.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./wts-elite-flight.js"></script>'
          if tag not in s:
              s = s.replace('</body>', '  ' + tag + '\n</body>')
          p.write_text(s, encoding='utf-8')
          Path('frontend/wts-history-layout.js').unlink(missing_ok=True)
          PY

      - name: Commit repaired UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/index.html frontend/wts-history-layout.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore index baseline and preserve history layout"
          git push
